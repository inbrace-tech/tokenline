# ─────────────────────────────────────────────────────────────────────────────
# CI — lints the shell scripts on every PR + push to main with ShellCheck.
# The repo is a single drop-in bash script, so ShellCheck is the whole quality
# gate.
# ─────────────────────────────────────────────────────────────────────────────
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Abort stale PR runs when a new commit lands on the same branch; never cancel
# push-to-main runs (each merge commit keeps its own run in history).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: the workflow only reads the repo.
permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # scandir "." finds every *.sh in the repo (tokenline.sh, install.sh).
      - uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # v2.0.0
        env:
          SHELLCHECK_OPTS: -s bash
        with:
          scandir: "."

  # Dev quality gate: lint, typecheck, test, build — on the pinned dev Node
  # (.nvmrc, currently 24). This is dev-time tooling: ESLint 10 and Vitest 4
  # themselves require Node 20+, so it deliberately does NOT run on the old end
  # of the support range. It also uploads the built artifact for the compat job.
  cli-dev:
    name: CLI (dev gate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Setup node + pnpm + install (Node from .nvmrc, pnpm from package.json)
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm lint
      # `pnpm lint` runs eslint --fix; fail the job if it changed anything in
      # CI (means the contributor didn't run lint before pushing).
      - name: Detect autofix drift
        run: |
          if ! git diff --exit-code; then
            echo "::error::pnpm lint produced changes in CI — run pnpm lint locally and commit the result."
            exit 1
          fi
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Hand the built CLI to cli-compat so it runs the *exact* published
      # artifact on every Node, without rebuilding (or installing the dev
      # toolchain, which doesn't support Node 18).
      - name: Upload built CLI
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  # Runtime compat: prove the *shipped* artifact runs across the whole
  # engines.node range (18, the floor, through 24). The dev toolchain doesn't run
  # on Node 18, but the CLI does — so we execute the prebuilt dist/cli.js (zero
  # runtime deps) on each line. This is what *earns* the ">=18" claim instead of
  # assuming it; the eslint-plugin-n floor rule is the matching author-time guard.
  # (18 and 20 are past upstream EOL but still widely installed; we keep
  # supporting them until a real need forces a deliberate floor raise.)
  cli-compat:
    name: CLI compat (Node ${{ matrix.node }})
    needs: cli-dev
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      # Don't cancel the other Node legs when one fails — we want to see whether a
      # break is version-specific (floor only) or across the board.
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24]
    steps:
      # Checkout provides package.json at the repo root; dist/cli.js reads its
      # version from ../package.json, so the layout must match the published one.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download built CLI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      # Just Node — no pnpm, no install. Consumers get a prebuilt, zero-dep CLI.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - name: Smoke-run the built CLI
        run: |
          set -euo pipefail
          echo "Node $(node -v)"
          version="$(node dist/cli.js --version)"
          test -n "$version"
          node dist/cli.js --help > /dev/null
          echo "ok: tokenline $version runs on $(node -v)"

  # Thin aggregation gate. This exact string "CLI" is the required status check
  # in the "Protect main branch" ruleset, so it must stay a single fixed name.
  # It fans in over the dev + compat jobs, letting us change either without ever
  # renaming (and orphaning) the required check. `if: always()` + the explicit
  # result check make the gate report a real pass/fail instead of a "skipped"
  # that branch protection would silently treat as green.
  cli:
    name: CLI
    needs: [cli-dev, cli-compat]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gate on the CLI jobs
        run: |
          if [ "${{ needs.cli-dev.result }}" != "success" ] || [ "${{ needs.cli-compat.result }}" != "success" ]; then
            echo "::error::CLI dev gate or Node-compat matrix did not pass."
            exit 1
          fi
