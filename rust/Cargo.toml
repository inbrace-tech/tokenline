[package]
name = "tokenline"
version = "0.1.0"
edition = "2021"
description = "A cache-aware statusline for AI coding CLIs"
license = "MIT"

[[bin]]
name = "tokenline"
path = "src/main.rs"

[lib]
name = "tokenline"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "unwind"   # catch_unwind MUST work; abort would be a non-zero exit
