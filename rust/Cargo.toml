[package]
name = "tokenline"
version = "0.1.0"
edition = "2024"
description = "A cache-aware statusline for AI coding CLIs"
license = "MIT"
repository = "https://github.com/inbrace-tech/tokenline"
rust-version = "1.85"   # MSRV floor forced by edition 2024 (stabilized in 1.85); proven by CI msrv job

[[bin]]
name = "tokenline"
path = "src/main.rs"

[lib]
name = "tokenline"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "unwind"   # catch_unwind MUST work; abort would be a non-zero exit

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
