[package]
name = "tokenline"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A cache-aware statusline for AI coding CLIs"
license = "MIT"
repository = "https://github.com/inbrace-tech/tokenline"

[[bin]]
name = "tokenline"
path = "src/main.rs"

[lib]
name = "tokenline"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jiff = "0.2"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "unwind" # catch_unwind MUST work; abort would be a non-zero exit
