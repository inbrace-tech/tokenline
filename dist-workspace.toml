[workspace]
members = ["cargo:rust"]

[dist]
# Recorded by `dist init`; use the version from Step 2 verbatim.
cargo-dist-version = "0.32.0"
# curl|sh + irm|iex installers (Homebrew/npm/msi are later follow-ups).
installers = ["shell", "powershell"]
# Locked release targets.
targets = [
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
# CI backend that builds + publishes the above.
ci = "github"
# Anchor the release-tag trigger to a "tokenline-" prefix so binary tags
# (tokenline-v0.1.0) are provably disjoint from the npm changesets tags
# (@inbrace-tech/tokenline@x.y.z). Renames the workflow to tokenline-release.yml.
tag-namespace = "tokenline"
